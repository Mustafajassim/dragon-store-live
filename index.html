<body>
<div id="root">
  <div class="boot-loader">
    <div class="boot-ring"></div>
    <div class="boot-logo">DRAGON STORE</div>
    <div class="boot-sub" id="bootSub">جاري التحميل...</div>
  </div>
</div>
<script>
(function(){
  var msgs=[
    'جاري التحميل...',
    'الاتصال يبدو بطيئاً — الصفحة تحتوي صوراً كثيرة، يرجى الانتظار...',
    'ما زلنا نُحمّل المنتجات، شكراً لصبرك...'
  ];
  var i=0;
  var timers=[
    setTimeout(function(){var el=document.getElementById('bootSub');if(el){i=1;el.textContent=msgs[1];}},6000),
    setTimeout(function(){var el=document.getElementById('bootSub');if(el){i=2;el.textContent=msgs[2];}},14000)
  ];
})();
</script>
<div class="ambient-glow" aria-hidden="true">
  <div class="glow-blob b1"></div>
  <div class="glow-blob b2"></div>
  <div class="glow-blob b3"></div>
</div>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF5500"/><stop offset="100%" stop-color="#FF8800"/></linearGradient>
    <linearGradient id="fireGradientHeader" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF5500"/><stop offset="100%" stop-color="#FF8800"/></linearGradient>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF5500"/><stop offset="100%" stop-color="#FF8800"/></linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF5500"/><stop offset="100%" stop-color="#FF8800"/></linearGradient>
  </defs>
</svg>
<script src="js/icons.js"></script>
