<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>الصفحة غير موجودة — DRAGON STORE</title>
<link rel="icon" type="image/png" href="/assets/images/brand/favicon-32.png">
<style>
*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#2a1206 0%,#08080b 60%);color:#f4f4f7;font-family:Tajawal,Tahoma,Arial,sans-serif}
.code{font-size:clamp(4rem,18vw,8rem);font-weight:900;line-height:1;background:linear-gradient(135deg,#ff4500,#ff8000 55%,#ffb347);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:1.3rem}p{color:#9a9aa6;max-width:420px;line-height:1.8}
a{display:inline-block;margin-top:8px;padding:13px 30px;border-radius:14px;background:linear-gradient(135deg,#ff4500,#ff8000);color:#fff;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="code">404</div>
<h1>هذه الصفحة غير موجودة</h1>
<p>ربما تغيّر الرابط أو حُذف المنتج. تصفّح المتجر من الصفحة الرئيسية.</p>
<a id="home" href="/">العودة إلى المتجر</a>
<script>(function(){var h=location.hostname.endsWith(".github.io")?"/"+location.pathname.split("/")[1]+"/":"/";document.getElementById("home").href=h;var l=document.querySelector("link[rel=icon]");if(l)l.href=h+"assets/images/brand/favicon-32.png";})();</script>
</body>
</html>
